<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" width="960" height="670" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Fraud detection: stacked ensemble architecture</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="670" fill="#ffffff"/>

  <!-- title -->
  <text x="30" y="46" font-size="22" font-weight="700" fill="#111827">Fraud detection: stacked ensemble</text>

  <!-- ==================== PREDICTION FLOW ==================== -->

  <!-- input -->
  <rect x="165" y="80" width="300" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="315" y="104" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Transaction features X</text>
  <text x="315" y="124" text-anchor="middle" font-size="12" fill="#4b5563">cleaned by data_clean.py</text>

  <!-- input → base learners -->
  <path d="M315 136 V163 H165 V186" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M315 163 H465 V186" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- xgboost -->
  <rect x="45" y="190" width="240" height="72" rx="8" fill="#e8f0fe" stroke="#4a6fa5"/>
  <text x="165" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">XGBoost</text>
  <text x="165" y="238" text-anchor="middle" font-size="12" fill="#4b5563">binary:logitraw</text>
  <text x="165" y="254" text-anchor="middle" font-size="12" fill="#4b5563">→ raw margin (logit)</text>

  <!-- isolation forest -->
  <rect x="345" y="190" width="240" height="72" rx="8" fill="#e6f4f1" stroke="#3a8a7a"/>
  <text x="465" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Isolation Forest</text>
  <text x="465" y="238" text-anchor="middle" font-size="12" fill="#4b5563">−score_samples</text>
  <text x="465" y="254" text-anchor="middle" font-size="12" fill="#4b5563">→ s(x) ∈ (0, 1], high = anomalous</text>

  <!-- iso log transform -->
  <path d="M465 262 V286" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="345" y="290" width="240" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="465" y="313" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">−log₂ s(x)</text>
  <text x="465" y="333" text-anchor="middle" font-size="12" fill="#4b5563">normalized path length E[h(x)] / c(n)</text>

  <!-- base learners → scalers -->
  <path d="M165 262 V372" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M465 346 V372" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- scalers -->
  <rect x="45" y="376" width="240" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="165" y="399" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">StandardScaler</text>
  <text x="165" y="419" text-anchor="middle" font-size="12" fill="#4b5563">xgb_scaler</text>

  <rect x="345" y="376" width="240" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="465" y="399" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">StandardScaler</text>
  <text x="465" y="419" text-anchor="middle" font-size="12" fill="#4b5563">iso_scaler</text>

  <!-- scalers → meta -->
  <path d="M165 432 V456 H315 V476" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M465 432 V456 H315" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="175" y="450" font-size="12" font-style="italic" fill="#4b5563">z_xgb</text>
  <text x="475" y="450" font-size="12" font-style="italic" fill="#4b5563">z_iso</text>

  <!-- meta learner -->
  <rect x="135" y="480" width="360" height="72" rx="8" fill="#fff4e0" stroke="#c58a1e"/>
  <text x="315" y="507" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Logistic regression (meta learner)</text>
  <text x="315" y="527" text-anchor="middle" font-size="12" fill="#4b5563">σ(b + w₁·z_xgb + w₂·z_iso)</text>
  <text x="315" y="543" text-anchor="middle" font-size="12" fill="#4b5563">L2 penalty, C tuned with Optuna</text>

  <!-- meta → output -->
  <path d="M315 552 V586" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- output -->
  <rect x="205" y="590" width="220" height="48" rx="8" fill="#e7f6ec" stroke="#2f8a4f"/>
  <text x="315" y="620" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">P(fraud)</text>

  <!-- ==================== TRAINING PANEL ==================== -->

  <rect x="630" y="80" width="300" height="558" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="652" y="110" font-size="16" font-weight="700" fill="#111827">How it's trained</text>

  <!-- step 1 -->
  <circle cx="664" cy="146" r="12" fill="#4a6fa5"/>
  <text x="664" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="686" y="151" font-size="14" font-weight="600" fill="#111827">Tune base learners</text>
  <text x="686" y="173" font-size="12" fill="#4b5563">Optuna + stratified K-fold on X_train.</text>
  <text x="686" y="190" font-size="12" fill="#4b5563">Each trial saves its out-of-fold scores.</text>

  <!-- step 2 -->
  <circle cx="664" cy="242" r="12" fill="#4a6fa5"/>
  <text x="664" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="686" y="247" font-size="14" font-weight="600" fill="#111827">Build meta training features</text>
  <text x="686" y="269" font-size="12" fill="#4b5563">Best trials' out-of-fold scores,</text>
  <text x="686" y="286" font-size="12" fill="#4b5563">transformed; the scalers are fit here.</text>

  <!-- step 3 -->
  <circle cx="664" cy="338" r="12" fill="#4a6fa5"/>
  <text x="664" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="686" y="343" font-size="14" font-weight="600" fill="#111827">Tune the meta learner</text>
  <text x="686" y="365" font-size="12" fill="#4b5563">Refit base learners on all of X_train,</text>
  <text x="686" y="382" font-size="12" fill="#4b5563">score X_val, pick C on it.</text>

  <!-- step 4 -->
  <circle cx="664" cy="434" r="12" fill="#c58a1e"/>
  <text x="664" y="439" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="686" y="439" font-size="14" font-weight="600" fill="#111827">Final fit</text>
  <text x="686" y="461" font-size="12" fill="#4b5563">Same steps on X (train + val) with the</text>
  <text x="686" y="478" font-size="12" fill="#4b5563">tuned params; score X_test.</text>

  <!-- step 5 -->
  <circle cx="664" cy="530" r="12" fill="#2f8a4f"/>
  <text x="664" y="535" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <text x="686" y="535" font-size="14" font-weight="600" fill="#111827">Log to MLflow</text>
  <text x="686" y="557" font-size="12" fill="#4b5563">Models, scalers and AUCPRs in</text>
  <text x="686" y="574" font-size="12" fill="#4b5563">best_models → tuning / final runs.</text>
</svg>
